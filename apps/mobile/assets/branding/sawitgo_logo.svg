<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E0B" />
      <stop offset="100%" stop-color="#0D241C" />
    </linearGradient>
    <linearGradient id="palmGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="palmGradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="25" y="25" width="450" height="450" rx="95" fill="url(#bgGrad)" stroke="#10B981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Geospatial / Sync Ring -->
  <circle cx="250" cy="235" r="165" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="14 10" stroke-opacity="0.4" />

  <!-- Stylized Geometric Palm Leaves (Agri Pattern) -->
  <g filter="url(#glowEffect)">
    <!-- Central Spear Leaf -->
    <path d="M250 85 C250 85, 275 160, 265 245 C255 245, 245 245, 235 245 C225 160, 250 85, 250 85 Z" fill="url(#palmGradPrimary)" />
    
    <!-- Left Leaf Fronds -->
    <path d="M245 170 C190 145, 140 185, 120 230 C155 235, 195 220, 240 205 Z" fill="url(#palmGradSecondary)" />
    <path d="M240 215 C175 225, 135 285, 125 330 C165 315, 205 280, 240 245 Z" fill="url(#palmGradPrimary)" />

    <!-- Right Leaf Fronds -->
    <path d="M255 170 C310 145, 360 185, 380 230 C345 235, 305 220, 260 205 Z" fill="url(#palmGradSecondary)" />
    <path d="M260 215 C325 225, 365 285, 375 330 C335 315, 295 280, 260 245 Z" fill="url(#palmGradPrimary)" />
  </g>

  <!-- Golden Palm Fruit / Sync Node (Harvest Core) -->
  <g filter="url(#glowEffect)">
    <circle cx="250" cy="275" r="32" fill="url(#goldGrad)" />
    <!-- Dynamic Lightning / Forward Arrow (GO) -->
    <path d="M245 255 L262 272 L248 274 L255 295 L238 277 L250 275 Z" fill="#070E0B" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    SAWIT<tspan fill="#F59E0B">GO</tspan>
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#34D399">
    OFFLINE-FIRST AGRI SYSTEM
  </text>
</svg>

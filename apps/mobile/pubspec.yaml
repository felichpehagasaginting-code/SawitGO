name: mobile
description: "SawitGO Mobile - Offline-First Palm Plantation Management & Traceability"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Utilities
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1

  # Local DB (Offline Persistence) & Crypto
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Networking & Connectivity
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Hardware & Geolocation
  geolocator: ^13.0.1
  mobile_scanner: ^5.2.3

  # UI / SVG Support
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - ../../assets/branding/
    - ../../assets/stickers/

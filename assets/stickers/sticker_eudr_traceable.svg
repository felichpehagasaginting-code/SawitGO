<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eudrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#021A1A" />
    </linearGradient>
    <filter id="eudrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sticker White Die-cut Border -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="#FFFFFF" filter="url(#eudrGlow)"/>
  
  <!-- Sticker Body -->
  <rect x="28" y="28" width="344" height="344" rx="72" fill="url(#eudrBg)"/>

  <!-- Earth Globe & Verification Checkmark -->
  <g transform="translate(120, 80)">
    <!-- Globe Ring -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#06B6D4" stroke-width="6" stroke-dasharray="10 8"/>
    <ellipse cx="80" cy="80" rx="35" ry="70" fill="none" stroke="#06B6D4" stroke-width="4"/>
    <line x1="10" y1="80" x2="150" y2="80" stroke="#06B6D4" stroke-width="4"/>
    
    <!-- GPS Pin Point -->
    <path d="M80 35 C65 35, 55 45, 55 60 C55 80, 80 110, 80 110 C80 110, 105 80, 105 60 C105 45, 95 35, 80 35 Z" fill="#F59E0B"/>
    <circle cx="80" cy="55" r="10" fill="#FFFFFF"/>

    <!-- Green Seal Checkmark -->
    <circle cx="125" cy="125" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M115 125 L123 133 L137 118" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- High-Contrast Typography Badge -->
  <rect x="45" y="275" width="310" height="60" rx="20" fill="#06B6D4"/>
  <text x="200" y="313" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="18" font-weight="900" letter-spacing="1" fill="#070E0B">
    EUDR / RSPO VERIFIED
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#99F6E4">
    100% SPATIAL TRACEABILITY
  </text>
</svg>

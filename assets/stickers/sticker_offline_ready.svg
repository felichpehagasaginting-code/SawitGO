<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="stickerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sticker White Die-cut Border -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="#FFFFFF" filter="url(#stickerGlow)"/>
  
  <!-- Sticker Body -->
  <rect x="28" y="28" width="344" height="344" rx="72" fill="url(#stkBg)"/>

  <!-- Satellite Dish / Signal Offline Icon -->
  <g transform="translate(110, 80)">
    <!-- Signal Slash / No Connection Bar -->
    <circle cx="90" cy="90" r="75" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="4"/>
    
    <!-- Satellite Icon -->
    <path d="M60 120 L120 60 M75 135 L135 75 M50 100 L100 50 M90 110 L110 90" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="50" r="14" fill="#F59E0B"/>
    
    <!-- Diagonal Red Slash -->
    <line x1="30" y1="30" x2="150" y2="150" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- High-Contrast Typography Badge -->
  <rect x="50" y="275" width="300" height="60" rx="20" fill="#10B981"/>
  <text x="200" y="313" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="20" font-weight="900" letter-spacing="1" fill="#070E0B">
    100% OFFLINE READY
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#94A3B8">
    ANTI BLANKSPOT GUARANTEED
  </text>
</svg>

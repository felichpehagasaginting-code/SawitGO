name: SawitGO CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Lint & TypeCheck (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS / Current)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package.json'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "package.json not yet present, skipping"
          fi

      - name: Run Linter
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          fi

  mobile-lint-and-analyze:
    name: Mobile Static Analysis (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies & Analyze
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
            flutter analyze
          else
            echo "pubspec.yaml not yet present, skipping"
          fi
